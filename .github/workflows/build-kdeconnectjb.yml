name: Build kdeconnectjb rootless package

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/build-kdeconnectjb.yml"
      - "Cargo.toml"
      - "Cargo.lock"
      - "kdeconnect/**"
      - "kdeconnectjb/**"
      - "ios/**"
  pull_request:
    paths:
      - ".github/workflows/build-kdeconnectjb.yml"
      - "Cargo.toml"
      - "Cargo.lock"
      - "kdeconnect/**"
      - "kdeconnectjb/**"
      - "ios/**"

jobs:
  build-deb:
    runs-on: macos-15-intel

    env:
      THEOS: ${{ github.workspace }}/theos-rootless-sdk17.5
      THEOS_PACKAGE_SCHEME: rootless
      RUSTUP_TOOLCHAIN: nightly
      CARGO_TERM_COLOR: always
      IPHONEOS_DEPLOYMENT_TARGET: "15.0"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Restore Theos cache
        uses: actions/cache@v4
        with:
          path: ${{ env.THEOS }}
          key: theos-${{ runner.os }}-rootless-sdk17.5-v1

      - name: Setup Theos with Swift-compatible iOS SDK
        uses: Randomblock1/theos-action@v1
        with:
          theos-dir: ${{ env.THEOS }}
          theos-src: https://github.com/theos/theos
          theos-sdks: https://github.com/Tonwalter888/iOS-SDKs
          theos-sdks-branch: master

      - name: Verify build toolchain
        run: |
          swift --version
          test -d "$THEOS/sdks/iPhoneOS17.5.sdk"
          echo "Using Theos SDK: $THEOS/sdks/iPhoneOS17.5.sdk"
          echo "Deployment target: $IPHONEOS_DEPLOYMENT_TARGET"

      - name: Setup Rust nightly with iOS target
        uses: dtolnay/rust-toolchain@nightly
        with:
          targets: aarch64-apple-ios

      - name: Restore Cargo cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ runner.os }}-${{ runner.arch }}-ios17.5-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            cargo-${{ runner.os }}-${{ runner.arch }}-ios17.5-

      - name: Build rootless package
        run: |
          cd ios
          ./make.sh package FINALPACKAGE=1 THEOS_PACKAGE_SCHEME=rootless

      - name: Validate produced rootless package
        run: |
          cd ios
          deb_path=$(find . -maxdepth 4 -type f -name "*iphoneos-arm64*.deb" | head -n 1)
          if [[ -z "$deb_path" ]]; then
            echo "No rootless .deb package (iphoneos-arm64) was produced"
            exit 1
          fi
          echo "Produced package: $deb_path"
          mkdir -p ../dist
          cp "$deb_path" "../dist/rootless-$(basename "$deb_path")"

      - name: Upload rootless .deb artifact
        uses: actions/upload-artifact@v4
        with:
          name: kdeconnectjb-rootless-deb
          path: dist/*.deb
          if-no-files-found: error
